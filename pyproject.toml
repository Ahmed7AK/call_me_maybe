[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pydantic", "llm_sdk"]

[tool.uv]
package = false

[tool.uv.sources]
llm_sdk = { path = "llm_sdk", editable = true }

[tool.mypy]
mypy_path = "llm_sdk"
exclude = '''(^|/)(\.venv|llm_sdk|data)/'''

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]
